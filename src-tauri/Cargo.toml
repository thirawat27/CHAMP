[package]
name = "champ"
version = "1.4.0"
description = "CHAMP - Caddy + HTTP(S) + Adminer + MySQL + PHP"
authors = ["Thirawat Sinlapasomsak"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "process", "sync", "time"] }
tokio-util = "0.7"
sha2 = "0.11"
hex = "0.4"
zip = { version = "9.1", default-features = false, features = ["deflate"] }
flate2 = "1.1"
tar = "0.4"
xz2 = "0.1"
sysinfo = { version = "0.39", default-features = false, features = ["system", "network"] }
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
getrandom = "0.3"
dunce = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

# Optimize release builds for size and speed
[profile.release]
opt-level = 3        # Maximum optimization
lto = true           # Link-time optimization — reduces binary size significantly
codegen-units = 1    # Single codegen unit — slower compile but smaller/faster binary
strip = true         # Strip debug symbols from binary
# NOTE: panic = "abort" is intentionally omitted — Tauri and some dependencies
# rely on unwinding for safe error handling during startup (tray icon, window setup).
